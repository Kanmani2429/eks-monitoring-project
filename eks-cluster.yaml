apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-monitoring-project
  region: us-east-1
  version: "1.33"

managedNodeGroups:
  - name: monitoring-node-group
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    privateNetworking: false

    tags:
      Project: eks-monitoring-project
      Environment: lab